name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Redéploie la stack une fois l'image latest poussée (sauté si le secret est absent)
      - name: Redéploiement Portainer
        if: github.ref == 'refs/heads/main' && env.PORTAINER_WEBHOOK != ''
        run: curl -fsS -X POST --retry 3 --retry-all-errors --max-time 60 "$PORTAINER_WEBHOOK"